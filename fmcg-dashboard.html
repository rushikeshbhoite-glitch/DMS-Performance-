<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMCG Field Analytics Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #1e293b; --secondary: #3b82f6; --dark: #0f172a; 
            --light: #f8fafc; --success: #10b981; --warning: #f59e0b; 
            --purple: #8b5cf6; --highlight: #eff6ff; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; color: #334155; }
        header { background: linear-gradient(135deg, var(--primary), #334155); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 24px; font-weight: 700; }
        .container { padding: 30px; max-width: 1400px; margin: auto; }
        
        .tabs { display: flex; gap: 12px; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 22px; border: none; background: #e2e8f0; font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 6px; }
        .tab-btn.active, .tab-btn:hover { color: white; background-color: var(--secondary); }

        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #f1f5f9; }
        .section-header { border-bottom: 2px solid var(--highlight); padding-bottom: 12px; margin-top: 0; margin-bottom: 20px; color: var(--primary); font-size: 18px; font-weight: 700;}
        
        .executive-summary { background: #f8fafc; border-left: 5px solid var(--secondary); padding: 20px; border-radius: 8px; font-size: 15px; line-height: 1.6; color: #334155; margin-bottom: 25px; }
        .executive-summary h3 { margin-top: 0; color: var(--dark); font-size: 18px; margin-bottom: 12px; }
        .executive-summary p { margin-bottom: 12px; }
        
        .upload-zone { border: 2px dashed #cbd5e1; padding: 30px; text-align: center; border-radius: 8px; background: #f8fafc; cursor: pointer; }
        .upload-zone:hover { border-color: var(--secondary); background: #eff6ff; }
        .upload-zone strong { color: var(--secondary); font-size: 16px; display: block; margin-bottom: 5px;}
        
        .mapping-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 15px 0; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; text-transform: uppercase;}
        select { padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-size: 14px; outline: none; }
        
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: white; padding: 20px 25px; border-radius: 10px; border-left: 5px solid var(--secondary); border-top: 1px solid #eee; border-right: 1px solid #eee; border-bottom: 1px solid #eee;}
        .kpi-title { font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 5px;}
        .kpi-value { font-size: 26px; font-weight: 800; color: var(--primary); }

        .dashboard-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .full-width { grid-column: 1 / -1; }
        
        .table-container { overflow-x: auto; max-height: 400px; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border); }
        th { background-color: #f8fafc; color: #475569; font-weight: 700; position: sticky; top: 0; z-index: 10;}

        .btn { background-color: var(--primary); color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; margin-right: 10px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-pdf { background-color: #e11d48; } 
        .btn-email { background-color: #059669; } 
        .btn-share { background-color: #7c3aed; }

        #action-bar { display: none; margin-bottom: 25px; background: white; padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>FMCG Analytics Dashboard</h1>
        <div style="font-size: 14px; color: #cbd5e1;">SFA Data Processor Engine</div>
    </header>

    <div class="container">
        <div class="tabs" id="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('user-perf')">👤 User Performance</button>
            <button class="tab-btn" onclick="switchTab('beat-perf')">📍 Beat Performance</button>
            <button class="tab-btn" onclick="switchTab('outlet-perf')">🏪 Outlet Performance</button>
            <button class="tab-btn" onclick="switchTab('dist-perf')">🚛 Distributor & Invoices</button>
        </div>
        
        <div id="controls-workspace"></div>

        <div id="action-bar">
            <button class="btn btn-pdf" onclick="exportToPDF()">📄 Export to PDF</button>
            <button class="btn btn-email" onclick="copyForEmail()">✉️ Copy for Email</button>
            <button class="btn btn-share" onclick="generateShareLink()">🔗 Generate Share Link</button>
        </div>

        <div id="analyticsOutputWorkspace" style="padding-bottom: 40px;"></div>
    </div>

    <script>
        let currentTab = 'user-perf';
        let rawSheetsData = {};
        let activeCharts = [];
        let isSharedMode = false;

        const modulesConfig = {
            'user-perf': { title: 'User-Wise Performance', mappings: [{ id: 'u_name', label: 'User Name' }, { id: 'u_calls', label: 'Total Calls' }, { id: 'u_pcalls', label: 'Productive Calls' }, { id: 'u_retail', label: 'Retailing Time' }] },
            'beat-perf': { title: 'Beat & Route Performance', mappings: [{ id: 'b_name', label: 'Beat Name' }, { id: 'b_outlets', label: 'Total Outlets' }, { id: 'b_visited', label: 'Visited Outlets' }, { id: 'b_value', label: 'Order Value' }] },
            'outlet-perf': { title: 'Outlet Wise Order Analytics', mappings: [{ id: 'o_name', label: 'Outlet Name' }, { id: 'o_channel', label: 'Channel Type' }, { id: 'o_value', label: 'Billing Value' }] },
            'dist-perf': { title: 'Distributor & Invoice Tracking', mappings: [{ id: 'd_region', label: 'Region / Zone' }, { id: 'd_type', label: 'Type (Superstockist/Stockist)' }, { id: 'd_name', label: 'Partner Name' }, { id: 'd_sku', label: 'SKU Name' }, { id: 'd_invoice', label: 'Invoice No.' }, { id: 'd_qty', label: 'Billed Quantity' }, { id: 'd_value', label: 'Billed Value' }] }
        };

        window.onload = function() { 
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'shared') {
                isSharedMode = true;
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('nav-tabs').style.display = 'none';
                document.getElementById('action-bar').style.display = 'none';
                if (urlParams.get('tab')) currentTab = urlParams.get('tab');
            }
            renderUploadUI(); 
        };

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('action-bar').style.display = 'none';
            document.getElementById('analyticsOutputWorkspace').innerHTML = '';
            renderUploadUI();
        }

        function renderUploadUI() {
            if (isSharedMode && document.getElementById('analyticsOutputWorkspace').innerHTML !== '') return;
            
            const config = modulesConfig[currentTab];
            let html = `
                <div class="card" id="upload-card">
                    <h2 class="section-header">${config.title}</h2>
                    <div class="upload-zone" onclick="document.getElementById('fileEngine').click()">
                        <strong>📤 Click to Upload Excel/CSV Sheet</strong>
                        <span style="color:#64748b;">Select the dataset for this module</span>
                        <input type="file" id="fileEngine" style="display:none" accept=".xlsx,.xls,.csv" onchange="processFile(this)"/>
                    </div>
                </div>
                <div id="mapping-card-workspace"></div>
            `;
            document.getElementById('controls-workspace').innerHTML = html;
        }

        function processFile(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                rawSheetsData[currentTab] = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                if (rawSheetsData[currentTab].length > 0) renderMappingUI(Object.keys(rawSheetsData[currentTab][0]));
            };
            reader.readAsArrayBuffer(file);
        }

        function renderMappingUI(headers) {
            let html = `<div class="card" id="map-card"><h3 class="section-header">⚙️ Map Sheet Columns</h3><div class="mapping-container">`;
            modulesConfig[currentTab].mappings.forEach(f => {
                html += `<div class="form-group"><label>${f.label}</label><select id="map_${f.id}">${headers.map(h => `<option value="${h}">${h}</option>`).join('')}</select></div>`;
            });
            html += `</div><button class="btn" onclick="generateDashboard()" style="margin-top: 15px; background:var(--secondary)">📊 Generate Analytics</button></div>`;
            document.getElementById('mapping-card-workspace').innerHTML = html;
        }

        function generateDashboard() {
            activeCharts.forEach(c => c.destroy());
            activeCharts = [];
            const data = rawSheetsData[currentTab];
            const container = document.getElementById('analyticsOutputWorkspace');
            container.innerHTML = '';

            if (currentTab === 'user-perf') buildUserDashboard(data, container);
            else if (currentTab === 'beat-perf') buildBeatDashboard(data, container);
            else if (currentTab === 'outlet-perf') buildOutletDashboard(data, container);
            else if (currentTab === 'dist-perf') buildDistributorDashboard(data, container);

            if (!isSharedMode) document.getElementById('action-bar').style.display = 'block';
        }

        function renderChart(canvasId, type, labels, datasets, options = {}) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const defaultOptions = { responsive: true, maintainAspectRatio: false, animation: false }; 
            activeCharts.push(new Chart(ctx, { type, data: { labels, datasets }, options: { ...defaultOptions, ...options } }));
        }

        // ==========================================
        // MODULE: USER PERFORMANCE
        // ==========================================
        function buildUserDashboard(data, container) {
            const k_n = document.getElementById('map_u_name').value, k_c = document.getElementById('map_u_calls').value, k_p = document.getElementById('map_u_pcalls').value;
            let tC=0, tP=0; 
            let users = data.map(r => { 
                const tc=parseInt(r[k_c])||0, pc=parseInt(r[k_p])||0; tC+=tc; tP+=pc;
                return {n: r[k_n]||'N/A', tc, pc, st: tc>0?((pc/tc)*100).toFixed(1):0}; 
            }).sort((a,b) => b.pc - a.pc);

            const strike = tC>0?((tP/tC)*100).toFixed(1):0;
            const avgCalls = users.length > 0 ? Math.round(tC/users.length) : 0;
            const topUser = users[0] || {n: 'N/A', pc: 0, st: 0};

            const narrative = `
                <h3>Executive Summary: Field Productivity</h3>
                <p><strong>Overall Deployment & Conversion:</strong> During this reporting period, the processed data reflects a total field force deployment of <strong>${users.length} active executives</strong>. Combined, this team executed <strong>${tC.toLocaleString()} total market calls</strong>, successfully converting <strong>${tP.toLocaleString()} productive orders</strong>. This establishes a baseline organizational strike rate of <strong>${strike}%</strong>.</p>
                <p><strong>Performance Disparity & Highlights:</strong> The average executive completed roughly ${avgCalls} calls. Performance is heavily skewed toward the top tier. The leading executive, <strong>${topUser.n}</strong>, secured ${topUser.pc.toLocaleString()} productive orders with a strike rate of ${topUser.st}%. The data indicates that the top 5 executives demonstrate strike rates significantly above the team median, reflecting highly effective route planning and superior pitch conversion that should be modeled for underperformers.</p>
            `;

            container.innerHTML = `
                <div class="executive-summary print-block">${narrative}</div>
                <div class="card print-block"><h2 class="section-header">Core KPIs</h2>
                    <div class="kpi-grid">
                        <div class="kpi-card"><div class="kpi-title">Active Users</div><div class="kpi-value">${users.length}</div></div>
                        <div class="kpi-card"><div class="kpi-title">Total Market Calls</div><div class="kpi-value">${tC.toLocaleString()}</div></div>
                        <div class="kpi-card"><div class="kpi-title">Productive Calls</div><div class="kpi-value">${tP.toLocaleString()}</div></div>
                        <div class="kpi-card"><div class="kpi-title">Team Strike Rate</div><div class="kpi-value">${strike}%</div></div>
                    </div>
                </div>
                <div class="dashboard-layout">
                    <div class="card print-block"><h3 class="section-header">Top Performers Matrix</h3>
                        <div class="table-container">
                            <table class="data-table">
                                <tr><th>Executive Name</th><th>Total Calls</th><th>Productive Calls</th><th>Strike Rate</th></tr>
                                ${users.slice(0,10).map((u,i) => `<tr><td><strong>#${i+1} ${u.n}</strong></td><td>${u.tc}</td><td>${u.pc}</td><td><strong>${u.st}%</strong></td></tr>`).join('')}
                            </table>
                        </div>
                    </div>
                    <div class="card print-block" style="height:400px"><h3 class="section-header">Call Efficiency Visualization</h3><div style="height:300px"><canvas id="c1"></canvas></div></div>
                </div>`;
            renderChart('c1', 'bar', users.slice(0,10).map(u=>u.n.substring(0,15)), [{label:'Total Calls', data:users.slice(0,10).map(u=>u.tc), backgroundColor:'#cbd5e1'}, {label:'Productive Calls', data:users.slice(0,10).map(u=>u.pc), backgroundColor:'#10b981'}]);
        }

        // ==========================================
        // MODULE: DISTRIBUTOR PERFORMANCE
        // ==========================================
        function buildDistributorDashboard(data, container) {
            const keys = { reg: 'map_d_region', type: 'map_d_type', name: 'map_d_name', sku: 'map_d_sku', inv: 'map_d_invoice', qty: 'map_d_qty', val: 'map_d_value' };
            const getVal = id => document.getElementById(keys[id]).value;
            
            let skus = {}, invoiceMap = {}, allPartners = {}, regionalStockist = {};
            let uniqueInvoices = new Set(), uniqueSS = new Set(), uniqueSt = new Set(), uniqueProducts = new Set();
            let totalSSVal = 0, totalStVal = 0, totalSOAmount = 0;

            data.forEach(r => {
                const reg = r[getVal('reg')]||'N/A', typeRaw = (r[getVal('type')]||'').toString().toLowerCase(), name = r[getVal('name')]||'Unknown';
                const sku = r[getVal('sku')]||'Unknown', inv = r[getVal('inv')]||'Unknown';
                const qty = parseFloat(r[getVal('qty')])||0, val = parseFloat(r[getVal('val')])||0;
                let isSS = typeRaw.includes('super') || typeRaw === 'ss';

                totalSOAmount += val;
                if(sku && sku!=='Unknown') uniqueProducts.add(sku);
                if(inv && inv!=='Unknown') uniqueInvoices.add(inv);
                if(isSS){ uniqueSS.add(name); totalSSVal += val; } else { uniqueSt.add(name); totalStVal += val; }

                if(!skus[sku]) skus[sku] = {qty:0, val:0}; skus[sku].qty+=qty; skus[sku].val+=val;
                if(!invoiceMap[inv]) invoiceMap[inv] = {name, qty:0, val:0}; invoiceMap[inv].qty+=qty; invoiceMap[inv].val+=val;
                if(!allPartners[name]) allPartners[name] = {type: isSS?'SS':'ST', qty:0, val:0}; allPartners[name].qty+=qty; allPartners[name].val+=val;

                if(!isSS){
                    if(!regionalStockist[reg]) regionalStockist[reg]={}; if(!regionalStockist[reg][name]) regionalStockist[reg][name]={qty:0,val:0};
                    regionalStockist[reg][name].qty+=qty; regionalStockist[reg][name].val+=val;
                }
            });

            let topSkus = Object.keys(skus).map(s => ({ sku:s, qty:skus[s].qty, val:skus[s].val })).sort((a,b)=>b.val-a.val);
            let topInvs = Object.keys(invoiceMap).map(i => ({ inv:i, name:invoiceMap[i].name, qty:invoiceMap[i].qty, val:invoiceMap[i].val })).sort((a,b)=>b.val-a.val);
            let topGlobalSS = Object.keys(allPartners).filter(n=>allPartners[n].type==='SS').map(name=>({name, qty:allPartners[name].qty, val:allPartners[name].val})).sort((a,b)=>b.val-a.val).slice(0,5);
            
            let topRegionalSt = [];
            for(let reg in regionalStockist){
                let topName = Object.keys(regionalStockist[reg]).reduce((a,b) => regionalStockist[reg][a].val > regionalStockist[reg][b].val ? a : b);
                topRegionalSt.push({ reg, name: topName, qty: regionalStockist[reg][topName].qty, val: regionalStockist[reg][topName].val });
            }
            topRegionalSt.sort((a,b)=>b.val-a.val);
            
            const narrative = `
                <h3>Executive Summary: Supply Chain & Invoicing Logistics</h3>
                <p><strong>Throughput & Volume Overview:</strong> The primary and secondary logistics pipeline successfully generated <strong>${uniqueInvoices.size.toLocaleString()} documented invoices</strong> during this period. These orders effectively covered a catalog width of <strong>${uniqueProducts.size.toLocaleString()} unique SKUs</strong>. The aggregated network operations resulted in a gross Sales Order (SO) ledger value of <strong>₹${totalSOAmount.toLocaleString()}</strong>.</p>
                <p><strong>Partner & Product Matrix:</strong> Fulfillment was executed via a bifurcated network consisting of <strong>${uniqueSS.size} active Superstockists</strong> and <strong>${uniqueSt.size} active Stockists</strong>. Supply chain velocity was overwhelmingly driven by the highest-performing SKU (<strong>${topSkus[0]?.sku || 'N/A'}</strong>), which single-handedly generated ₹${(topSkus[0]?.val||0).toLocaleString()}. Inventory alignment and credit tracking should be heavily prioritized for the top-ranking Superstockist partner, <strong>${topGlobalSS[0]?.name || 'N/A'}</strong>, as their throughput significantly impacts overall regional liquidity.</p>
            `;

            container.innerHTML = `
                <div class="executive-summary print-block">${narrative}</div>
                <div class="card print-block"><h2 class="section-header">Logistics & Supply KPIs</h2>
                    <div class="kpi-grid">
                        <div class="kpi-card"><div class="kpi-title">Total Invoices</div><div class="kpi-value">${uniqueInvoices.size.toLocaleString()}</div></div>
                        <div class="kpi-card"><div class="kpi-title">Active SKUs Billed</div><div class="kpi-value">${uniqueProducts.size.toLocaleString()}</div></div>
                        <div class="kpi-card"><div class="kpi-title">SS / Stockists</div><div class="kpi-value" style="font-size:22px;">${uniqueSS.size} / ${uniqueSt.size}</div></div>
                        <div class="kpi-card"><div class="kpi-title">Total SO Amount</div><div class="kpi-value" style="color:var(--success);">₹${totalSOAmount.toLocaleString()}</div></div>
                    </div>
                </div>

                <div class="dashboard-layout">
                    <div class="card print-block" style="height:380px;"><h3 class="section-header">Sales Share: Superstockist vs Stockist</h3><div style="height:280px;"><canvas id="shareChart"></canvas></div></div>
                    
                    <div class="card print-block"><h3 class="section-header">Global Top 5 Superstockists</h3>
                        <div class="table-container">
                            <table class="data-table">
                                <tr><th>Rank</th><th>Superstockist Name</th><th>Value (₹)</th></tr>
                                ${topGlobalSS.map((ss, i) => `<tr><td><strong>#${i+1}</strong></td><td>${ss.name}</td><td><strong>₹${ss.val.toLocaleString()}</strong></td></tr>`).join('')}
                            </table>
                        </div>
                    </div>

                    <div class="card full-width print-block"><h3 class="section-header">Regional Champions: Top Stockist per Zone</h3>
                        <div class="table-container">
                            <table class="data-table">
                                <tr><th>Geographic Region / Zone</th><th>Stockist Partner Name</th><th>Volume Handled</th><th>Total Value (₹)</th></tr>
                                ${topRegionalSt.map((st) => `<tr><td><strong>${st.reg}</strong></td><td>${st.name}</td><td>${st.qty.toLocaleString()}</td><td style="color:var(--warning); font-weight:bold;">₹${st.val.toLocaleString()}</td></tr>`).join('')}
                            </table>
                        </div>
                    </div>

                    <div class="card print-block"><h3 class="section-header">Top 10 High-Velocity SKUs</h3>
                        <div class="table-container">
                            <table class="data-table">
                                <tr><th>SKU Description</th><th>Sold Quantity</th><th>Value Contribution (₹)</th></tr>
                                ${topSkus.slice(0,10).map((s,i) => `<tr><td><strong>#${i+1} ${s.sku}</strong></td><td>${s.qty.toLocaleString()}</td><td style="color:var(--success); font-weight:bold;">₹${s.val.toLocaleString()}</td></tr>`).join('')}
                            </table>
                        </div>
                    </div>

                    <div class="card print-block"><h3 class="section-header">Top 10 Mega Invoices</h3>
                        <div class="table-container">
                            <table class="data-table">
                                <tr><th>Invoice Reference</th><th>Billed Entity</th><th>Invoice Value (₹)</th></tr>
                                ${topInvs.slice(0,10).map((inv) => `<tr><td style="font-family:monospace; color:var(--secondary); font-weight:bold;">${inv.inv}</td><td>${inv.name}</td><td><strong>₹${inv.val.toLocaleString()}</strong></td></tr>`).join('')}
                            </table>
                        </div>
                    </div>

                    <div class="card full-width print-block" style="height:450px"><h3 class="section-header">SKU Financial Contribution Margin</h3><div style="height:350px"><canvas id="skuChart"></canvas></div></div>
                </div>`;
            
            renderChart('shareChart', 'doughnut', ['Superstockists', 'Stockists'], [{data:[totalSSVal, totalStVal], backgroundColor:['#8b5cf6', '#f59e0b']}], { cutout: '65%' });
            renderChart('skuChart', 'bar', topSkus.slice(0,10).map(s=>s.sku.substring(0,30)), [{label:'SKU Sales Value (₹)', data:topSkus.slice(0,10).map(s=>s.val), backgroundColor:'#3b82f6'}]);
        }

        // ==========================================
        // EXPORT ENGINE 1: NATIVE PDF (Foolproof)
        // ==========================================
        // This generates a clean HTML string of ONLY the output, opens a print window, and uses native browser PDF rendering. 
        // No chopped charts. Perfect page breaks.
        function exportToPDF() {
            const workspace = document.getElementById('analyticsOutputWorkspace');
            if (!workspace || workspace.innerHTML.trim() === '') {
                alert("Please generate analytics first."); return;
            }

            const clone = workspace.cloneNode(true);
            
            // Convert Canvases to Images
            const origCanvases = workspace.getElementsByTagName('canvas');
            const cloneCanvases = clone.getElementsByTagName('canvas');
            for(let i = 0; i < origCanvases.length; i++) {
                const img = document.createElement('img');
                img.src = origCanvases[i].toDataURL('image/png', 1.0); 
                img.style.maxWidth = '100%'; img.style.display = 'block'; img.style.margin = '0 auto';
                cloneCanvases[i].parentNode.replaceChild(img, cloneCanvases[i]);
            }

            // Create Print Document
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>FMCG Report Export</title>
                    <style>
                        body { font-family: Arial, sans-serif; color: #333; padding: 20px; }
                        h2, h3 { color: #1e293b; margin-bottom: 10px; }
                        .print-block { 
                            page-break-inside: avoid; /* Prevents tables/charts cutting in half */
                            page-break-after: always; /* Forces 1 item per page */

            `);
            printWindow.document.close();

        // ==========================================
        // EXPORT ENGINE 2: EMAIL COPY (Foolproof)
        // ==========================================
        function copyForEmail() {
            const workspace = document.getElementById('analyticsOutputWorkspace');
            if (!workspace || workspace.innerHTML.trim() === '') {
                alert("Please generate analytics first."); return;
            }

            const clone = workspace.cloneNode(true);
            
            // Hardcode Styles for Email Clients
            clone.querySelectorAll('.print-block, .card, .executive-summary').forEach(el => {
                el.style.border = '1px solid #cbd5e1'; el.style.padding = '20px'; el.style.marginBottom = '20px';
                el.style.backgroundColor = '#ffffff'; el.style.fontFamily = 'Arial, sans-serif';
            });
            
            clone.querySelectorAll('table').forEach(t => {
                t.setAttribute('border', '1'); t.setAttribute('cellpadding', '10'); t.setAttribute('cellspacing', '0');
                t.style.borderCollapse = 'collapse'; t.style.width = '100%';
            });

            clone.querySelectorAll('th').forEach(th => { th.style.backgroundColor = '#f1f5f9'; th.style.textAlign = 'left'; });

            // Convert Charts
            const origCanvases = workspace.getElementsByTagName('canvas');
            const cloneCanvases = clone.getElementsByTagName('canvas');
            for(let i = 0; i < origCanvases.length; i++) {
                const img = document.createElement('img');
                img.src = origCanvases[i].toDataURL('image/png', 1.0); 
                img.style.maxWidth = '600px'; img.style.display = 'block';
                cloneCanvases[i].parentNode.replaceChild(img, cloneCanvases[i]);
            }

            const finalHTML = `
                <div style="font-family: Arial, sans-serif; color: #334155; max-width: 800px;">
                    <h2 style="color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">FMCG Report</h2>
                    ${clone.innerHTML}
                </div>`;

            // Create an invisible div, inject HTML, highlight it, and copy
            const container = document.createElement('div');
            container.innerHTML = finalHTML;
            container.style.position = 'fixed';
            container.style.left = '-9999px';
            document.body.appendChild(container);

            const range = document.createRange();
            range.selectNodeContents(container);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);

            try {
                const success = document.execCommand('copy');
                if (success) {
                    alert("✅ Rich HTML Copied successfully!\n\nOpen your email (Gmail/Outlook) and press Paste (Ctrl+V).");
                } else { throw new Error(); }
            } catch (err) {
                alert("❌ Browser blocked copy action. Use Export to PDF instead.");
            }
            
            sel.removeAllRanges();
            document.body.removeChild(container);
        }

        // ==========================================
        // SHARE LINK
        // ==========================================
        function generateShareLink() {
            let baseUrl = window.location.href.split('?')[0].split('#')[0];
            let shareUrl = baseUrl + '?mode=shared&tab=' + currentTab;
            
            if (baseUrl.startsWith('file://')) {
                alert("⚠️ Local File Detected!\n\nTo share this URL over the internet, you must host this HTML file on a free static site like GitHub Pages or Tiiny.host.");
            } else {
                prompt("Copy your Shareable Dashboard Link:", shareUrl);
            }
        }
    </script>
